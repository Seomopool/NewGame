<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #191d26;
      --line: #2a3140;
      --ink: #e6ebf2;
      --muted: #8a94a6;
      --accent: #5ed3a3;
      --win: #5ed3a3;
      --loss: #e8697d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(92vw, 380px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 26px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #12151c;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 14px;
    }
    .primary {
      width: 100%;
      margin-top: 12px;
      background: var(--accent);
      color: #06251a;
    }
    .primary:hover { filter: brightness(1.08); }
    .error { color: var(--loss); font-size: 13px; min-height: 18px; margin-top: 8px; }

    .who { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .who .name { font-size: 20px; font-weight: 700; }
    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 6px 12px;
      font-size: 13px;
    }
    .ghost:hover { color: var(--ink); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: #12151c;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
    }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat.hero .num { color: var(--accent); }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; }

    /* 문제 풀이 영역 */
    .quiz {
      background: #12151c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 18px;
      margin-bottom: 18px;
      text-align: center;
    }
    .problem { font-size: 30px; font-weight: 700; letter-spacing: .02em; min-height: 40px; }
    .quiz-input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; }
    .quiz-input-row input { text-align: center; font-size: 18px; }
    .submit { background: var(--accent); color: #06251a; padding: 0 20px; }
    .submit:hover { filter: brightness(1.08); }
    .feedback { min-height: 22px; margin-top: 12px; font-size: 14px; font-weight: 600; }
    .feedback.ok { color: var(--win); }
    .feedback.no { color: var(--loss); }
    .skip {
      background: transparent; border: 1px solid var(--line);
      color: var(--muted); margin-top: 10px; width: 100%; padding: 8px;
    }
    .skip:hover { color: var(--ink); }

    /* 순위 대시보드 */
    .board-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 10px; }
    .board-head h2 { font-size: 15px; margin: 0; }
    .refresh { background: transparent; border: none; color: var(--accent); font-size: 12px; padding: 2px 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
    td { border-bottom: 1px solid #1e2430; }
    td.r { text-align: right; }
    tr.me { background: rgba(94,211,163,.08); }
    tr.me td { color: var(--accent); font-weight: 600; }
    .rank-medal { font-weight: 700; }

    .note { margin-top: 18px; font-size: 11px; color: var(--muted); line-height: 1.5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="login-view" class="card">
    <h1>플레이어 로그인</h1>
    <p class="sub">닉네임을 입력하면 스탯이 저장돼요.</p>
    <input id="nickname-input" type="text" placeholder="닉네임" maxlength="20" autocomplete="off" />
    <button id="login-btn" class="primary">시작하기</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- 게임/스탯 화면 -->
  <div id="game-view" class="card" hidden>
    <div class="who">
      <span class="name" id="player-name"></span>
      <button id="logout-btn" class="ghost">로그아웃</button>
    </div>
    <div class="stats">
      <div class="stat hero"><div class="num" id="stat-academic">0</div><div class="lbl">ACADEMIC</div></div>
      <div class="stat"><div class="num" id="stat-solved">0</div><div class="lbl">SOLVED</div></div>
      <div class="stat"><div class="num" id="stat-attempted">0</div><div class="lbl">TRIED</div></div>
    </div>

    <!-- 수학문제 -->
    <div class="quiz">
      <div class="problem" id="problem-text">…</div>
      <div class="quiz-input-row">
        <input id="answer-input" type="number" inputmode="numeric" placeholder="정답" autocomplete="off" />
        <button id="submit-btn" class="submit">제출</button>
      </div>
      <div class="feedback" id="quiz-feedback"></div>
      <button id="skip-btn" class="skip">다른 문제</button>
    </div>

    <!-- 순위 대시보드 -->
    <div class="board-head">
      <h2>학업 순위</h2>
      <button id="refresh-btn" class="refresh">새로고침</button>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>닉네임</th><th class="r">학업</th><th class="r">정답</th></tr>
      </thead>
      <tbody id="board-body"></tbody>
    </table>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
