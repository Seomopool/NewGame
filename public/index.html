<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인생 배틀</title>
    <style>
        body {
            text-align: center;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
        
        /* 대기실 스타일 */
        #lobby {
            margin: 100px auto;
            padding: 30px;
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #btn-find-match {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        #btn-find-match:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* 게임 화면 스타일 (기존과 동일) */
        #game-ui { display: none; /* 처음엔 숨김 */ }
        #arena {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 800px;
            height: 300px;
            background-color: #fff;
            border: 4px solid #333;
            border-radius: 10px;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .player-card {
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ccc;
            background-color: #f9f9f9;
        }
        .my-card { border-color: #4facfe; background-color: #e0f2fe; }
        .enemy-card { border-color: #f77062; background-color: #ffeef0; }
        .dead { background-color: #555 !important; color: white; }
        .hp-bar-container {
            width: 100%; height: 20px; background-color: #ddd; border-radius: 10px; margin-bottom: 10px; overflow: hidden;
        }
        .hp-bar { height: 100%; background-color: #4caf50; transition: width 0.3s; }
        #controls { margin-top: 20px; }
        .action-btn {
            padding: 15px 25px; font-size: 16px; margin: 0 10px; cursor: pointer; border: none; border-radius: 5px; background-color: #333; color: white; font-weight: bold;
        }
        .action-btn:hover { background-color: #555; }
    </style>
</head>
<body>

    <h1>👶 인생 키우기 배틀 🧓</h1>

    <!-- 1. 대기실 화면 -->
    <div id="lobby">
        <h2>대기실</h2>
        <p id="lobby-status">준비가 완료되면 매칭을 시작하세요.</p>
        <button id="btn-find-match">매칭 시작</button>
    </div>

    <!-- 2. 게임 배틀 화면 -->
    <div id="game-ui">
        <p>0살부터 시작해서 훈련하고 상대를 쓰러뜨리세요!</p>
        <div id="arena"></div>
        <div id="controls">
            <button class="action-btn" id="btn-grow">🎂 나이 먹기 (체력+, 돈+20)</button>
            <button class="action-btn" id="btn-train">💪 훈련하기 (돈-30, 힘+15)</button>
            <button class="action-btn" id="btn-attack">⚔️ 공격하기</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>

</body>
</html>
